name: Spielseite
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/website_daten.py', '.github/workflows/spielseite.yml']
  release:
    types: [published, released, edited]
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: spielseite-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Öffentliche APK und Release für die Roadmap lesen
        run: python3 tools/website_daten.py --roadmap docs/roadmap.json --output docs/data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
